# ==============================================================================
# Spendly AI - Backend project definition
#
# This file declares WHAT we depend on (loose constraints) and how our tools
# are configured. `uv.lock` records the EXACT resolved versions and is what
# guarantees reproducible installs. Edit this file; never edit uv.lock.
# ==============================================================================

[project]
name = "spendly-backend"
version = "0.1.0"
description = "Spendly AI - AI-powered personal finance platform (backend)"
readme = "../README.md"
requires-python = ">=3.12,<3.13"

# ------------------------------------------------------------------------------
# Runtime dependencies.
# Every entry needs a justification. Milestone 1 only - auth and AI packages
# arrive with the milestones that need them.
# ------------------------------------------------------------------------------
dependencies = [
    # Web framework + ASGI server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database: ORM, migrations, driver
    # The [asyncio] extra pulls in greenlet, which is what lets SQLAlchemy's
    # synchronous internals run under async without rewriting them.
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    # asyncpg, not psycopg. psycopg's async mode refuses to run on Windows'
    # ProactorEventLoop, which uvicorn installs after importing the app -
    # overriding any loop policy the app sets. See CLAUDE.md "Known gotchas".
    "asyncpg>=0.31.0",
    # Configuration: validate environment variables at startup, not at 3am
    "pydantic-settings>=2.6.0",
    # Backs pydantic's EmailStr. Validating an address by regex is famously
    # wrong - the grammar in RFC 5322 is not regular - so this delegates to a
    # maintained implementation rather than to a clever pattern.
    "email-validator>=2.2.0",
    # JSON Web Tokens. PyJWT, not python-jose: jose has had no release since
    # 2021 and carries known CVEs, while PyJWT is maintained and is what the
    # FastAPI documentation itself moved to.
    "pyjwt>=2.10.0",
    # Password hashing. Argon2id is OWASP's first recommendation and won the
    # 2015 Password Hashing Competition. Used directly rather than through
    # passlib, which has had no release since 2020 and breaks against modern
    # bcrypt - the FastAPI tutorial still shows it, and it should not.
    "argon2-cffi>=23.1.0",
    # Required by FastAPI/Starlette to parse multipart/form-data bodies
    # (UploadFile) - the CSV import endpoint. Without it, the request raises
    # at runtime, not at import time.
    "python-multipart>=0.0.17",
    # Gives SQLAlchemy a Vector column type and distance operators for
    # pgvector (the extension has shipped in the db container since M1,
    # unused until now). Milestone 10 - transaction embeddings.
    "pgvector>=0.5.0",
    # Async HTTP client. Was dev-only (FastAPI's TestClient uses it under the
    # hood); promoted to a runtime dependency in M10 because
    # services/embedding.py uses it to call Ollama's local HTTP API.
    "httpx>=0.28.0",
]

# ------------------------------------------------------------------------------
# Development dependencies (uv's dependency-group standard).
# Installed locally and in CI, never shipped in the production image.
# ------------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    # httpx itself moved to runtime dependencies (M10); still needed here as
    # a dev dep because that's what FastAPI's TestClient uses under the hood.
    "ruff>=0.8.0",         # linter + formatter (replaces flake8/black/isort)
    "mypy>=1.13.0",        # static type checker
    "pytest-asyncio>=0.24.0",
]

# ==============================================================================
# Tool configuration
# Keeping this in pyproject.toml (rather than .flake8, setup.cfg, mypy.ini,
# pytest.ini, ...) means one config file instead of five.
# ==============================================================================

# ------------------------------------------------------------------------------
# uv
# This backend is an APPLICATION we run, not a LIBRARY anyone installs.
# `package = false` tells uv to manage the venv and dependencies without
# trying to build/install this project itself.
# ------------------------------------------------------------------------------
[tool.uv]
package = false

# ------------------------------------------------------------------------------
# Ruff - linting and formatting
# ------------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (likely bugs)
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade (modern Python idioms)
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length - the formatter already handles this
]

# ------------------------------------------------------------------------------
# Coverage
#
# `concurrency` matters here. SQLAlchemy's async layer runs database calls
# inside greenlets, and coverage.py does not trace greenlet-switched code
# unless told to. Without this, lines that execute AFTER an awaited query are
# reported as uncovered - which quietly understates coverage and, worse,
# makes the report untrustworthy exactly where the interesting code is.
# ------------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff.lint.isort]
# Without this, ruff sees the local `alembic/` directory and classifies the
# `alembic` package as first-party, then demands it be separated from other
# third-party imports. It is a third-party library that merely shares a name
# with our migrations folder.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and fixture shadowing freely
"tests/**/*.py" = ["S101"]
# Alembic generates migrations from a mako template. Two artifacts of that
# templating cannot be fixed in the template itself:
#   F401 - `sqlalchemy as sa` is imported whether or not a migration uses it
#   W291 - `Revises: ${down_revision}` leaves a trailing space when a
#          migration has no parent (the first one)
# Real problems in migration bodies are still linted; only these are exempt.
"alembic/versions/*.py" = ["F401", "W291", "E501"]

# ------------------------------------------------------------------------------
# Mypy - static type checking
# Strict-ish from day one. Retrofitting types onto an untyped codebase is
# painful; starting typed costs almost nothing.
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages without type stubs
module = ["alembic.*"]
ignore_missing_imports = true

# ------------------------------------------------------------------------------
# Pytest
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-v",
    "--strict-markers",     # typo'd marker names fail instead of silently passing
    "--strict-config",
]
markers = [
    "integration: tests that require a running database",
]
# "auto" treats every `async def test_*` as an asyncio test, so individual
# @pytest.mark.asyncio decorators are unnecessary. With the default "strict"
# mode, forgetting the decorator makes a test silently pass without ever
# running - a genuinely dangerous failure mode.
asyncio_mode = "auto"
# Fixtures live for one test function unless declared otherwise, keeping test
# isolation the default rather than something to remember.
asyncio_default_fixture_loop_scope = "function"
